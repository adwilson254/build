name: Sync Upstream, Inject & Promote

# Branch model:
#   main = source of truth: full upstream code + the cleaner/injector scripts +
#          tests + CI. It is NEVER stripped.
#   ap   = deployable build: stripped of non-Rivian code + Rivian features
#          injected. Fully generated by this workflow; never hand-edited.
#
# Pipeline:
#   1. merge AdventurePilot upstream into main (submodule-safe; fail on real conflict)
#   2. push main (source tracking) when upstream advanced
#   3. on a throwaway build branch: build web UI, strip non-Rivian, inject features
#   4. gate: lint + fast pure-Python tests (no full build -- "option B")
#   5. only if green: force-push the validated build to `ap`
#
# The injectors are idempotent, so an unchanged upstream produces a stable ap.
#
# Manual "deploy_only" dispatch skips the upstream merge and just builds the
# current main into ap -- useful to ship a known-good build without pulling new
# upstream changes.

on:
  schedule:
    - cron: '0 3 * * *'      # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip the AdventurePilot merge; build current main into ap'
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/AdventurePilotDev/AdventurePilot.git
  UPSTREAM_BRANCH: ap-dev

jobs:
  sync-inject-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main (no submodules; not needed for clean/inject/test)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge AdventurePilot upstream (submodule-safe; fail on real conflict)
        id: merge
        if: ${{ !inputs.deploy_only }}
        run: |
          before="$(git rev-parse HEAD)"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"
          # Never try to recursively merge submodule contents.
          git config submodule.recurse false

          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            after="$(git rev-parse HEAD)"
            [ "$before" != "$after" ] && echo "advanced=true" >> "$GITHUB_OUTPUT" || echo "advanced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Merge reported conflicts. Auto-resolve submodule gitlink + .gitmodules
          # conflicts by keeping our pinned versions; fail on any real file conflict.
          sub_paths="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | awk '{print $2}')"
          unresolved=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ "$path" = ".gitmodules" ] || printf '%s\n' $sub_paths | grep -qxF "$path"; then
              git checkout --ours -- "$path" && git add -- "$path"
            else
              unresolved="$unresolved $path"
            fi
          done < <(git diff --name-only --diff-filter=U)

          if [ -n "$unresolved" ]; then
            echo "::error::Real merge conflicts requiring manual resolution:$unresolved"
            git merge --abort || true
            exit 1
          fi

          git commit --no-edit
          after="$(git rev-parse HEAD)"
          [ "$before" != "$after" ] && echo "advanced=true" >> "$GITHUB_OUTPUT" || echo "advanced=false" >> "$GITHUB_OUTPUT"

      - name: Push main (source tracking)
        if: ${{ !inputs.deploy_only && steps.merge.outputs.advanced == 'true' }}
        run: git push origin main

      - name: Set up Python tooling
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff==0.15.4 pytest==8.3.4 requests==2.32.3 paho-mqtt==2.1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build deployable tree (build web UI, strip, inject)
        run: |
          git checkout -B ap-build
          # Build the React frontend so the injected dist matches its index.html.
          (cd scripts/features/src/web_ui/frontend && npm ci && npm run build)
          python3 scripts/rivian_cleaner.py
          python3 scripts/features/inject_api.py
          python3 scripts/features/inject_mqtt.py
          python3 scripts/features/inject_web.py
          python3 scripts/features/inject_scores.py

      - name: Lint Rivian additions (bug-class rules)
        run: |
          # Focus the gate on real defects (pyflakes/syntax/bare-except) rather
          # than style noise. Exclude injection *fragments* that are not
          # standalone modules.
          ruff check --select F,E9,E722 \
            --exclude scripts/features/src/rivian/ui_api_snippet.py \
            scripts/features scripts/rivian_cleaner.py \
            selfdrive/rivian tests/antigravity

      - name: Fast test gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -c ci/pytest-fast.ini --rootdir "$GITHUB_WORKSPACE" tests/antigravity

      - name: Promote validated build to ap
        run: |
          git add -A
          git commit -m "deploy: strip non-Rivian + inject features (main @ ${GITHUB_SHA::8})" || \
            echo "Nothing to commit (build identical)."
          # ap is fully generated from main; overwrite it with the validated tree.
          git push --force origin ap-build:ap
