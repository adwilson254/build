; Minimal, isolated pytest config for the fast pure-Python gate.
; Deliberately does NOT inherit the repo pyproject.toml options (xdist auto,
; -Werror, asyncio fixture config) which assume the full compiled environment.
[pytest]
minversion = 6.0
addopts = -q -p no:cacheprovider --noconftest --continue-on-collection-errors
python_files = test_*.py
testpaths = tests/antigravity
